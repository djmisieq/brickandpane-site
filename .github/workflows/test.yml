name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The runners' apt mirror can be unreachable (11.11.2026: DNS failures for over an hour); the runner image
      # already has what Chromium needs, so fall back to the browser alone instead of failing before any test runs.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: node build.mjs
      # The built pages are committed for GitHub Pages; fail if someone edited src/ and forgot to rebuild.
      - run: git diff --exit-code -- '*.html'
      - run: node --test tests/db/rls.test.mjs
      # Visual baselines are per OS and kept locally, so CI skips them.
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

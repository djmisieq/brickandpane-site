# Supabase Free pauses a project after 7 days without traffic, and a paused project drops quote requests.
# One read every 3 days keeps it awake. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY; until they exist it does nothing.
# Remove this workflow after moving to Supabase Pro (Pro projects are never paused).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase secrets not set, skipping."; exit 0; fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/contact_requests?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

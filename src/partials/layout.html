<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
{{base}}<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<!-- Robots: set per page by build.mjs (INDEXABLE switch; private pages are always noindex). -->
<meta name="robots" content="{{robots}}">
{{canonicalTag}}<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="Brick &amp; Pane">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
<meta name="twitter:card" content="summary_large_image">
{{alternates}}
<meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="{{root}}img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="{{root}}fonts/inter-tight-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}css/style.css">
<meta property="og:image" content="https://brickandpane.co.uk/img/photos/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogImageAlt}}">
{{jsonld}}{{head}}
</head>
<body class="has-action-bar {{bodyClass}}">
<a class="skip" href="#main">{{skip}}</a>
{{header}}
<main id="main">
{{content}}
</main>
{{footer}}
<script src="{{root}}js/photos.js"></script>
<script type="module" src="{{root}}js/main.js"></script>
</body>
</html>
